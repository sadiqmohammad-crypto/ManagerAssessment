<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manager Judgment Assessment</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap">
<style>
/* Layout: a test-booklet column (max 760px) for people answering; the administrator's console widens to 1180px with tabs over a card grid. */
:root{
  --bg:#f6f6f3; --surface:#ffffff; --surface-2:#f0f0ec; --ink:#141412; --ink-2:#52514e; --ink-3:#77756e; --line:#e1e0d9; --line-2:#c9c8bf;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-wash:#e7f0fc; --on-accent:#ffffff;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --crit-ink:#a82a2a; --crit-wash:#fbeaea; --warn-wash:#fdf3d9; --good-wash:#e6f5e6;
  --pat-a:#2a78d6; --pat-d:#eb6834; --pat-p:#1baf7a; --pat-r:#eda100; --pat-x:#898781;
  --lv1:#86b6ef; --lv2:#5598e7; --lv3:#2a78d6; --lv4:#1c5cab; --lv5:#104281;
  --neg:#d03b3b; --grid:#e1e0d9; --axis:#c3c2b7; --tint:#eeeee9;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-read:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#96948c; --line:#2c2c2a; --line-2:#44443f;
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:#14263e; --on-accent:#ffffff;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#e05252; --crit-ink:#f08c8c; --crit-wash:#3a1b1b; --warn-wash:#3a2f12; --good-wash:#14301a;
    --pat-a:#3987e5; --pat-d:#d95926; --pat-p:#199e70; --pat-r:#c98500; --pat-x:#898781;
    --lv1:#184f95; --lv2:#256abf; --lv3:#3987e5; --lv4:#6da7ec; --lv5:#9ec5f4;
    --neg:#e05252; --grid:#2c2c2a; --axis:#44443f; --tint:#232321;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#96948c; --line:#2c2c2a; --line-2:#44443f;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:#14263e; --on-accent:#ffffff;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#e05252; --crit-ink:#f08c8c; --crit-wash:#3a1b1b; --warn-wash:#3a2f12; --good-wash:#14301a;
  --pat-a:#3987e5; --pat-d:#d95926; --pat-p:#199e70; --pat-r:#c98500; --pat-x:#898781;
  --lv1:#184f95; --lv2:#256abf; --lv3:#3987e5; --lv4:#6da7ec; --lv5:#9ec5f4;
  --neg:#e05252; --grid:#2c2c2a; --axis:#44443f; --tint:#232321;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 56px;min-height:60vh}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;color:var(--ink);text-decoration:none;font-weight:600;letter-spacing:-0.005em}
.brand-mark{font-family:var(--font-num);font-size:12px;font-weight:500;color:var(--accent-ink);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;letter-spacing:.04em}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:var(--ink-2);text-decoration:none;font-size:13.5px;padding:6px 10px;border-radius:var(--r-sm)}
.top nav a:hover{background:var(--surface-2);color:var(--ink)}
.top nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2);font-weight:500}
.wrap{margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:28px;min-width:0}
.wrap.narrow{max-width:760px}
.wrap.wide{max-width:1180px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-0.01em}
h1{font-size:30px;font-weight:600}
h2{font-size:21px;font-weight:600}
h3{font-size:16px;font-weight:600}
h4{font-size:13px;font-weight:600;color:var(--ink-2)}
p{margin:0}
a{color:var(--accent-ink)}
.eyebrow{font-family:var(--font-num);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lede{font-size:17px;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack.tight{gap:6px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-width:0}
.row.between{justify-content:space-between}
.grow{flex:1 1 0;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.hero{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.choice{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-decoration:none;color:var(--ink);transition:border-color .12s, transform .12s}
.choice:hover{border-color:var(--accent)}
.choice .who{font-family:var(--font-num);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.choice .what{font-size:17px;font-weight:600}
.choice .how{color:var(--ink-2);font-size:13.5px}
.choice .go{margin-top:6px;color:var(--accent-ink);font-weight:500;font-size:13.5px}
.notice{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;color:var(--ink-2);font-size:14px}
.notice.warn{border-left-color:var(--warn);background:var(--warn-wash);color:var(--ink)}
.notice.crit{border-left-color:var(--crit);background:var(--crit-wash);color:var(--ink)}
.notice.good{border-left-color:var(--good);background:var(--good-wash);color:var(--ink)}
.notice strong{color:var(--ink)}
dl.facts{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:10px 18px;margin:0}
dl.facts dt{font-weight:600}
dl.facts dd{margin:0;color:var(--ink-2)}
@media (max-width:520px){dl.facts{grid-template-columns:1fr;gap:2px 0}dl.facts dd{margin-bottom:10px}}
.btn{appearance:none;font:inherit;font-weight:500;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.94)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent-ink);padding-inline:8px}
.btn.quiet:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit-ink);border-color:var(--crit)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
label.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
label.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font-size:13px;font-weight:500;color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--ink-3)}
select,input[type="text"],input[type="number"],input[type="search"],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;width:100%;min-width:0}
textarea{font-family:var(--font-num);font-size:12.5px;line-height:1.5}
/* question screen */
.q-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-family:var(--font-num);font-size:12.5px;color:var(--ink-2)}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .2s}
.scenario{font-family:var(--font-read);font-size:19px;line-height:1.55;max-width:66ch}
.instr{font-size:13.5px;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.opt.is-most{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.opt.is-least{border-color:var(--ink-2);box-shadow:inset 3px 0 0 var(--ink-2)}
.opt-letter{font-family:var(--font-num);font-size:13px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.opt-text{min-width:0}
.opt-picks{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pick{appearance:none;font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.pick:hover{border-color:var(--ink-3);color:var(--ink)}
.pick.most[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pick.least[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (max-width:640px){
  .opt{grid-template-columns:28px 1fr}
  .opt-picks{grid-column:1 / -1;justify-content:stretch}
  .opt-picks .pick{flex:1 1 0;text-align:center}
  .scenario{font-size:17.5px}
}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{appearance:none;width:26px;height:26px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);font-family:var(--font-num);font-size:11px;cursor:pointer;padding:0}
.dot.done{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.save{font-size:12.5px;color:var(--ink-3);min-height:18px}
.save.err{color:var(--crit-ink)}
/* survey */
.sq{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.sq:first-child{border-top:0}
.sq p{max-width:52ch}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale button{appearance:none;font:inherit;font-size:12.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:var(--r-sm);padding:6px 8px;cursor:pointer;min-width:62px}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scale button.cs{min-width:0;color:var(--ink-3);border-style:dashed}
.scale button.cs[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:var(--bg);border-style:solid}
@media (max-width:760px){.sq{grid-template-columns:1fr}.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.scale button{min-width:0;padding:9px 4px}}
.people{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);max-height:320px;overflow-y:auto}
.person{appearance:none;font:inherit;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.person:first-child{border-top:0}
.person:hover{background:var(--surface-2)}
.person[aria-pressed="true"]{background:var(--accent-wash)}
.person .tag{font-size:12px;color:var(--ink-3)}
/* console */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;font:inherit;border:0;background:transparent;color:var(--ink-2);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-0.01em;line-height:1.15}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.scroll-x{overflow-x:auto;min-width:0}
table.data{border-collapse:collapse;width:100%;font-size:13.5px}
table.data th{font-weight:500;color:var(--ink-2);text-align:left;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
table.data th button{appearance:none;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data td.n,table.data th.n{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--surface-2)}
table.data tr.sel td{background:var(--accent-wash)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--ink)}
.chip.prov{border-style:dashed;color:var(--ink-2)}
.chip.flag{border-color:var(--crit);color:var(--crit-ink);background:var(--crit-wash)}
.chip.ok{border-color:var(--good)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.sw.lv1{background:var(--lv1)}.sw.lv2{background:var(--lv2)}.sw.lv3{background:var(--lv3)}.sw.lv4{background:var(--lv4)}.sw.lv5{background:var(--lv5)}
.sw.pa{background:var(--pat-a)}.sw.pd{background:var(--pat-d)}.sw.pp{background:var(--pat-p)}.sw.pr{background:var(--pat-r)}.sw.px{background:var(--pat-x)}
.bars{display:grid;grid-template-columns:minmax(120px,max-content) 1fr max-content;gap:8px 12px;align-items:center;font-size:13.5px}
.bars .lab{color:var(--ink)}
.bars .val{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2);text-align:right}
.track{position:relative;height:14px;background:var(--surface-2);border-radius:4px;min-width:60px}
.track > i{position:absolute;top:0;bottom:0;border-radius:4px}
.track .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--axis)}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
svg text{font-family:var(--font-ui)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;padding:6px 9px;border-radius:6px;max-width:260px;white-space:pre-line}
details.fold > summary{cursor:pointer;color:var(--accent-ink);font-weight:500;font-size:13.5px}
details.fold[open] > summary{margin-bottom:10px}
pre.summary{white-space:pre-wrap;font-family:var(--font-ui);font-size:14px;line-height:1.55;background:var(--surface-2);border-radius:var(--r-sm);padding:14px;margin:0;max-height:420px;overflow:auto}
.loading{color:var(--ink-2);padding:40px 0;text-align:center}
.foot{max-width:1180px;margin:36px auto 0;color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}


[hidden]{display:none!important}
.acct{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.acct-name{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate{padding-top:48px}
.gate-card{max-width:560px}
code{font-family:var(--font-num);font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:4px}

body{margin:0}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#"><span class="brand-mark">FORM A</span><span>Manager Judgment Assessment</span></a>
    <nav id="nav" aria-label="Sections"></nav>
    <span id="acct" class="acct" hidden></span>
  </header>
  <div id="gate" class="wrap narrow gate" hidden></div>
  <main id="view" class="wrap narrow"><div class="loading" role="status">Loading</div></main>
  <footer class="foot">Draft form v0.2. The answer key and all results are stored where only administrators can read them.</footer>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script src="config.js"></script>
<script>

const CONTENT = {"items": [{"id": "i11", "num": "1.1", "dim": 1, "text": "Leadership has confirmed that a client migration your team is running will be paused so that people can move to a new priority. The migration is 70% done. Its lead has worked several weekends on it and is proud of it.", "options": [{"id": "a", "text": "Tell the team this week what changed and why, and agree with the lead how to park the work cleanly."}, {"id": "b", "text": "Let the lead finish the last 30% of the migration first, since stopping now would waste the effort already invested."}, {"id": "c", "text": "Move the lead onto the new priority straight away, and ask two others to wind the migration down by Friday."}, {"id": "d", "text": "Hold off telling the team until leadership puts the change in writing, since priorities have shifted twice this year."}]}, {"id": "i12", "num": "1.2", "dim": 1, "text": "You have taken over a support team whose only target is tickets closed per day. The team hits it every week, but customers are reopening more and more tickets, and complaints are rising.", "options": [{"id": "a", "text": "Leave the target as it is for now, because the team is meeting it and a change so soon would hurt morale."}, {"id": "b", "text": "Remind the team at the next meeting that quality matters as much as speed, and leave the targets as they are."}, {"id": "c", "text": "Replace the volume target with a strict quality target, and review each reopened ticket with the person who closed it."}, {"id": "d", "text": "Keep the volume target, add a target for reopened tickets, and explain to the team why both will count from now on."}]}, {"id": "i13", "num": "1.3", "dim": 1, "text": "You are setting next quarter's target. Your team beat an easy target last quarter. A senior leader wants it doubled. Your own analysis says a 25% rise is demanding but reachable.", "options": [{"id": "a", "text": "Tell the leader the team needs a quarter to consolidate, and keep the target close to last quarter's actual result."}, {"id": "b", "text": "Show the leader your analysis, propose 25% with a stretch figure above it, and settle the number before you tell the team."}, {"id": "c", "text": "Accept the doubled target, since the leader may know about plans you do not, and ask the team to aim as high as they can."}, {"id": "d", "text": "Agree the doubled target with the leader, and tell the team privately that a 25% rise will count as a good quarter."}]}, {"id": "i21", "num": "2.1", "dim": 2, "text": "A well-liked team member has missed three of the last five deadlines. Each time there was a credible reason: a sick child, a system outage, a late input from another team. Colleagues have started covering for them.", "options": [{"id": "a", "text": "Put them on a written improvement plan with weekly checkpoints, since three misses in five is now a formal performance issue."}, {"id": "b", "text": "Accept the reasons, since each was outside their control, and ask the whole team to flag early when a deadline is at risk."}, {"id": "c", "text": "Quietly move their time-critical work to others for a while, so deadlines are met without singling anyone out."}, {"id": "d", "text": "Meet them privately, raise the pattern rather than each reason, and agree what will change by a set date."}]}, {"id": "i22", "num": "2.2", "dim": 2, "text": "Your top salesperson closed a large deal by promising a delivery date that operations had already said was impossible. The client is delighted. Operations is furious and wants it reversed.", "options": [{"id": "a", "text": "Keep the deal, agree a realistic date with operations, and tell the salesperson privately that dates need their sign-off."}, {"id": "b", "text": "Congratulate the salesperson at the team meeting, and ask operations to treat this delivery date as a one-off exception."}, {"id": "c", "text": "Remind the whole team that delivery dates need operations' sign-off, without naming anyone, and leave this deal as it is."}, {"id": "d", "text": "Call the client yourself today to reset the delivery date, then explain to the salesperson why you had to step in."}]}, {"id": "i23", "num": "2.3", "dim": 2, "text": "Ratings are due. One team member met every goal this year. Two colleagues have hinted that they took credit for shared work, but nobody has complained formally and you have not seen it yourself.", "options": [{"id": "a", "text": "Lower the rating by one step and explain that how results are achieved matters as much as the results themselves."}, {"id": "b", "text": "Before ratings close, check the facts with the people involved, then rate on what you can confirm."}, {"id": "c", "text": "Give the rating their goals support, since hints are not evidence and the process is designed around goals."}, {"id": "d", "text": "Rate on goals, and mention in the appraisal that they should make sure colleagues get credit for shared work."}]}, {"id": "i31", "num": "3.1", "dim": 3, "text": "A system failure is costing a client money every hour. Your senior engineer rates her fix as 80% likely to work. A second engineer wants two more hours to investigate first. Your own manager cannot be reached.", "options": [{"id": "a", "text": "Give the second engineer one more hour to investigate, then apply whichever fix the evidence then supports."}, {"id": "b", "text": "Give each engineer five minutes to make their case, then decide yourself and tell the client."}, {"id": "c", "text": "Let the two engineers settle it between them, since they understand the system far better than you do."}, {"id": "d", "text": "Approve the senior engineer's fix at once, since she has the most experience and every hour costs the client money."}]}, {"id": "i32", "num": "3.2", "dim": 3, "text": "Two of your senior people have proposed rival plans for clearing a recurring backlog. Both plans are sound. Each person has lobbied you privately. The whole team will have to carry out whichever plan you choose.", "options": [{"id": "a", "text": "Trial each plan on half of the backlog for two weeks, then keep whichever produces the better results."}, {"id": "b", "text": "Choose the plan you judge stronger, announce it, and thank the other person privately for the work on their proposal."}, {"id": "c", "text": "Have both present to the team against the same criteria, invite challenge, then make the decision yourself and explain it."}, {"id": "d", "text": "Combine the best parts of both plans into one, so that both senior people see their work reflected in the outcome."}]}, {"id": "i33", "num": "3.3", "dim": 3, "text": "Your team's error rate doubled this month. A senior stakeholder wants a fix in place by Monday. The quickest option is a second review of all work, which would cut output by about a fifth.", "options": [{"id": "a", "text": "Put a second review on the highest-risk work only, and use the week to find out what changed this month."}, {"id": "b", "text": "Introduce the second review on all work from Monday, and remove it once the error rate is back to normal."}, {"id": "c", "text": "Explain to the stakeholder that one month is too short to read a trend, and keep monitoring the numbers."}, {"id": "d", "text": "Find out who made the most errors this month, and put only their work through a second review until it improves."}]}, {"id": "i41", "num": "4.1", "dim": 4, "text": "A junior team member has just given their first client presentation. It went badly: too much detail and no clear recommendation. The client was polite. Your colleague is clearly discouraged.", "options": [{"id": "a", "text": "Lead the next two client presentations yourself and let them observe, so they can rebuild confidence without pressure."}, {"id": "b", "text": "Send them a short written list of what worked and what to change, so they can refer back to it before the next one."}, {"id": "c", "text": "Later that day, ask how they think it went, add the point they missed, and book a dry run for next time."}, {"id": "d", "text": "Reassure them that first client presentations rarely go well, and offer to share your notes if they would like them."}]}, {"id": "i42", "num": "4.2", "dim": 4, "text": "A strong team member has done the same role well for three years and no longer asks for new work. A complex project is coming up that would stretch them. Your team relies on their steady output.", "options": [{"id": "a", "text": "Mention the project in their next review, and ask them to let you know if it interests them."}, {"id": "b", "text": "Keep their role as it is, because pushing a content, productive person risks the reliability the team depends on."}, {"id": "c", "text": "Assign them the project and tell them you are confident the stretch will be good for their career."}, {"id": "d", "text": "Ask what they want from the next two years, and offer the project as one option, with your support."}]}, {"id": "i43", "num": "4.3", "dim": 4, "text": "You tell a team member that their monthly reports often contain calculation errors. They reply sharply that nobody else has ever complained.", "options": [{"id": "a", "text": "Accept that the past is past, and suggest the two of you check the next three reports together."}, {"id": "b", "text": "Agree that the errors are small, and suggest a short checklist that might save them time."}, {"id": "c", "text": "Show two recent examples, ask how they check their figures, and agree one change to try."}, {"id": "d", "text": "Explain that other people have noticed the errors too, so they need to take the feedback seriously."}]}, {"id": "i51", "num": "5.1", "dim": 5, "text": "You delegated an important client report to an experienced team member. Their draft takes a different approach from the one you would take. You think yours is slightly better, but theirs fully meets the brief. It is due tomorrow.", "options": [{"id": "a", "text": "Ask them to restructure it along your lines, and explain your reasons, since this client matters a great deal."}, {"id": "b", "text": "Approve the draft without comment, so that they feel fully trusted on an important piece of work."}, {"id": "c", "text": "Make the structural changes yourself tonight and send it, then explain to them what you changed and why."}, {"id": "d", "text": "Tell them it meets the brief, and offer your idea as an option they are free to ignore."}]}, {"id": "i52", "num": "5.2", "dim": 5, "text": "You want to hand the monthly client review to a team member who has never run one. They are willing but nervous. The next review is in two weeks and the client is important.", "options": [{"id": "a", "text": "Give them your previous slides and talking points, so they have a proven structure to work from."}, {"id": "b", "text": "Agree the outcome you need, let them plan it, and go through their plan together beforehand."}, {"id": "c", "text": "Run this review yourself once more while they observe, since they are still nervous about it."}, {"id": "d", "text": "Hand it over completely and tell them you trust them, so they feel full ownership from the start."}]}, {"id": "i53", "num": "5.3", "dim": 5, "text": "For the third time this week, a team member asks you how to handle a routine client request that they have the authority to handle themselves.", "options": [{"id": "a", "text": "Answer it, since the client is waiting, and raise the pattern at their next review."}, {"id": "b", "text": "Ask them to send these requests to you by email in future, so you can approve them all in one batch."}, {"id": "c", "text": "Answer quickly this time, and write a short guide to the requests that come up most often."}, {"id": "d", "text": "Ask what they would do and why, and if it is sound, tell them to decide these themselves."}]}, {"id": "i61", "num": "6.1", "dim": 6, "text": "A dependable team member's parent is seriously ill. They have not asked for anything, but their work has slipped, and a large deadline is ten days away.", "options": [{"id": "a", "text": "Quietly move their deadline work to a colleague, so that they have one less thing to worry about."}, {"id": "b", "text": "Give them the details of the employee assistance programme, and let them know your door is always open."}, {"id": "c", "text": "Ask privately how they are and what would help, offering options such as moving some work."}, {"id": "d", "text": "Say that you understand, and agree a day-by-day plan with them so that the deadline can still be met."}]}, {"id": "i62", "num": "6.2", "dim": 6, "text": "Your team delivered a difficult project early. In a large meeting, a senior leader praises you personally. Two team members did most of the hard work.", "options": [{"id": "a", "text": "Accept the praise, and describe how you planned the project so that it could finish ahead of schedule."}, {"id": "b", "text": "Say that it was a whole-team effort, and that everyone in the team deserves the credit equally."}, {"id": "c", "text": "Thank the leader and say briefly which two team members did the core work and what they did."}, {"id": "d", "text": "Accept the praise graciously, and make sure the two are named in your written project summary."}]}, {"id": "i63", "num": "6.3", "dim": 6, "text": "Your team has worked late for three weeks and met a hard client deadline. A new urgent request has just arrived. The two people best placed to handle it are the most exhausted.", "options": [{"id": "a", "text": "Check with the requester what is truly urgent, plan the minimum around those two people, and tell the team why."}, {"id": "b", "text": "Share the request with the team and ask for volunteers, so that no one is forced to take it on."}, {"id": "c", "text": "Give the work today to the people with the most relevant experience, and plan time off once it is done."}, {"id": "d", "text": "Turn the request down on the team's behalf, so that everyone can recover properly this week."}]}, {"id": "i71", "num": "7.1", "dim": 7, "text": "A high-profile assignment has come up. One team member, who is also a friend outside work, has asked you for it. Another is equally qualified but works at a different site and has not asked.", "options": [{"id": "a", "text": "Split the assignment between the two of them, so that neither one feels overlooked."}, {"id": "b", "text": "Give it to your friend, who showed initiative by asking, and offer the next one to the other person."}, {"id": "c", "text": "Give it to the one who did not ask, so that nobody can say you favoured your friend."}, {"id": "d", "text": "Announce the assignment as open to both, set out the criteria in advance, and choose against them."}]}, {"id": "i72", "num": "7.2", "dim": 7, "text": "An error in your own instructions caused the team to miss a client deadline. The client has blamed a team member. Part of your bonus depends on client satisfaction, and your manager asks what happened.", "options": [{"id": "a", "text": "Describe it to both as a process gap, which is accurate, and keep the conversation on the fix."}, {"id": "b", "text": "Tell your manager it was your error, and tell the client that the team has fixed the process that caused it."}, {"id": "c", "text": "Tell your manager and the client plainly that the error came from your instructions, and what you have changed."}, {"id": "d", "text": "Explain that the team member misread your instructions, since the version they worked from was unclear."}]}, {"id": "i73", "num": "7.3", "dim": 7, "text": "Two team members ask for the same week of leave. Policy says requests are handled in the order received. The later request is from your top performer, and it is a critical week for a client.", "options": [{"id": "a", "text": "Approve the earlier request, as the policy says, and help your top performer find other dates."}, {"id": "b", "text": "Approve your top performer's request, given the client week, and offer the other person an extra day later."}, {"id": "c", "text": "Ask the two of them to agree between themselves, as they know their own circumstances best."}, {"id": "d", "text": "Refuse both requests for that week, since the client work makes any absence too risky."}]}, {"id": "i81", "num": "8.1", "dim": 8, "text": "In a team meeting you present your plan for a new process. A junior team member says, hesitantly, that it may create duplicate work. The room goes quiet.", "options": [{"id": "a", "text": "Pause the rollout on the spot, and ask the junior member to draft an alternative plan for next week."}, {"id": "b", "text": "Thank them, ask them to explain how the duplicate work would arise, and ask who else sees it."}, {"id": "c", "text": "Say it is a good point, and suggest you discuss it one-to-one after the meeting so the agenda keeps moving."}, {"id": "d", "text": "Explain the reasoning that already covers that risk, so the team can see the plan has been thought through."}]}, {"id": "i82", "num": "8.2", "dim": 8, "text": "A team member tells you they sent a client the wrong file yesterday. The client has not noticed yet. Correcting it means admitting the mistake to the client.", "options": [{"id": "a", "text": "Send the correct file with a short note that it is an updated version, without drawing attention to the mistake."}, {"id": "b", "text": "Ask them to correct it with the client, and to let you know if there is any problem."}, {"id": "c", "text": "Thank them for telling you quickly, and agree together how to tell the client and correct it today."}, {"id": "d", "text": "Thank them, then contact the client yourself so that it is handled at the right level."}]}, {"id": "i83", "num": "8.3", "dim": 8, "text": "Two team members have stopped speaking to each other after a disagreement over who owns a task. Work is being delayed, and others are starting to take sides.", "options": [{"id": "a", "text": "Decide who owns the task yourself today, and tell both of them that the matter is now closed."}, {"id": "b", "text": "Hear each of them separately, then bring them together to agree who owns what from now on."}, {"id": "c", "text": "Give them a week to sort it out themselves, as adults usually resolve these things better without a manager."}, {"id": "d", "text": "Arrange a team lunch so they can reconnect informally before you address the task itself."}]}, {"id": "i91", "num": "9.1", "dim": 9, "text": "The company is replacing a tool your team likes with one they consider worse. The decision is final. You have doubts yourself, and you must announce it tomorrow.", "options": [{"id": "a", "text": "Forward the company announcement, and offer to answer any questions people have about it."}, {"id": "b", "text": "Give the reasons as you understand them, be honest about what gets harder, and pass their concerns upwards."}, {"id": "c", "text": "Tell the team that you also think it is the wrong decision, but that you will all have to live with it."}, {"id": "d", "text": "Present the change positively and keep your own doubts to yourself, so the team adopts it without resistance."}]}, {"id": "i92", "num": "9.2", "dim": 9, "text": "Another department keeps delivering inputs late, so your team misses its own deadlines. Your team is angry and wants you to act.", "options": [{"id": "a", "text": "Meet the other manager with the data on delays, agree a handover standard, and escalate only if it fails."}, {"id": "b", "text": "Build buffer time into your team's plans, so its deadlines are protected whatever the other department does."}, {"id": "c", "text": "Tell your team you agree it is unacceptable, and promise them the other department will hear about it."}, {"id": "d", "text": "Escalate to senior management with the evidence, so that the problem is fixed at the right level quickly."}]}, {"id": "i93", "num": "9.3", "dim": 9, "text": "You are introducing a new quality checklist. Your most experienced team member tells others it is a waste of time and keeps working the old way. The others are watching.", "options": [{"id": "a", "text": "Talk to them privately, ask what they object to, and ask for their help improving it for everyone."}, {"id": "b", "text": "Exempt them for now, given their track record, and review whether the checklist adds value for experienced staff."}, {"id": "c", "text": "Remind the whole team in the next meeting that the checklist is required for everyone, without naming anyone."}, {"id": "d", "text": "Tell them privately that further refusal to use the checklist will be treated as a performance issue."}]}], "survey": [{"id": "t1", "dim": 1, "text": "My manager makes clear what is expected of me and by when."}, {"id": "t2", "dim": 1, "text": "My manager explains how my work connects to the team's priorities."}, {"id": "t3", "dim": 2, "text": "My manager follows up on what we have agreed."}, {"id": "t4", "dim": 2, "text": "My manager deals promptly with poor performance in the team."}, {"id": "t5", "dim": 3, "text": "My manager makes decisions in time for us to act on them."}, {"id": "t6", "dim": 3, "text": "My manager asks for input from the people a decision affects."}, {"id": "t7", "dim": 4, "text": "My manager gives me specific feedback that helps me do my work better."}, {"id": "t8", "dim": 4, "text": "My manager talks with me about my development."}, {"id": "t9", "dim": 5, "text": "My manager lets me decide how to do my work."}, {"id": "t10", "dim": 5, "text": "My manager trusts me with work that stretches me."}, {"id": "t11", "dim": 6, "text": "My manager notices and acknowledges good work."}, {"id": "t12", "dim": 6, "text": "My manager shows concern for my wellbeing."}, {"id": "t13", "dim": 7, "text": "My manager holds everyone on the team to the same standards."}, {"id": "t14", "dim": 7, "text": "My manager does what they say they will do."}, {"id": "t15", "dim": 8, "text": "I can disagree with my manager without negative consequences."}, {"id": "t16", "dim": 8, "text": "My manager deals with conflict in the team instead of letting it continue."}, {"id": "t17", "dim": 9, "text": "My manager explains the reasons behind changes that affect us."}, {"id": "t18", "dim": 9, "text": "My manager resolves problems with other teams that block our work."}]};

const $ = function(q, r){ return (r||document).querySelector(q); };
const clone = function(o){ return JSON.parse(JSON.stringify(o)); };
const nowISO = function(){ return new Date().toISOString(); };
const mean = function(a){ return a.length ? a.reduce(function(x,y){ return x+y; },0)/a.length : NaN; };
const variance = function(a){ if(a.length<2) return NaN; const m=mean(a); return a.reduce(function(s,x){ return s+(x-m)*(x-m); },0)/(a.length-1); };
const sd = function(a){ return Math.sqrt(variance(a)); };
const sumBy = function(arr, f){ let s=0; for(let i=0;i<arr.length;i++) s+=f(arr[i]); return s; };
const median = function(a){ if(!a.length) return NaN; const b=a.slice().sort(function(x,y){ return x-y; }); const m=Math.floor(b.length/2); return b.length%2 ? b[m] : (b[m-1]+b[m])/2; };
const pct = function(n,d){ return d ? Math.round(100*n/d) : 0; };
const signed = function(n){ return (n>0?'+':'')+n; };
const f1 = function(n){ return isFinite(n) ? (Math.round(n*10)/10).toFixed(1) : 'n/a'; };

  if(!C.sample) put(v, h('div',{class:'card'}, h('h3',null,'End of cycle'), h('p',{class:'muted'}, 'Delete every answer, every piece of team feedback and every locked copy. The answer key and settings are kept. This cannot be undone.'),
    C.confirmDelete==='ALL' ? h('div',{class:'row'}, h('div',{class:'field', style:{maxWidth:'220px'}}, h('label',{for:'wipe-word'}, 'Type DELETE to confirm'), h('input',{type:'text', id:'wipe-word', autocomplete:'off'})), h('button',{class:'btn sm', onclick:function(){ C.confirmDelete=null; render(); }}, 'Keep the data'), h('button',{class:'btn sm danger', id:'wipe-go', disabled:C.busy, onclick:wipeAll}, C.busy ? 'Deleting' : 'Delete all participant data'))
      : h('div',{class:'row'}, h('button',{class:'btn sm danger', id:'wipe', onclick:function(){ C.confirmDelete='ALL'; render(); }}, 'Delete all participant data'))));
}
async function saveSettings(){
  const C=st.c; const num=function(id){ return Number($('#'+id).value); };
  const S2={proficient:num('s-prof'), minimum:num('s-min'), semMode:$('#s-semmode').value, semManual:num('s-sem'), rfLower:num('s-rfl'), rfFloor:num('s-rff'), surveyThreshold:num('s-svthr')};
  const cfg2={open:$('#c-open').value==='open', timeLimitMin:num('c-time'), minRaters:num('c-minr'), form:FORM};
  let bad='';
  if(!(S2.proficient>S2.minimum)) bad='The Proficient standard must be higher than the Minimum standard.';
  else if(S2.proficient>54 || S2.minimum<-54) bad='Standards must lie between -54 and +54.';
  else if(!(S2.semManual>0 && S2.semManual<=20)) bad='The margin of error must be between 0 and 20.';
  else if(!(S2.rfLower>=1 && S2.rfFloor>S2.rfLower && S2.rfFloor<=27)) bad='The red-flag numbers must rise: the Level 1 number has to be higher than the lowering number.';
  else if(!(S2.surveyThreshold>=1 && S2.surveyThreshold<=5)) bad='The team survey threshold must be between 1 and 5.';
  else if(!(cfg2.minRaters>=3 && cfg2.minRaters<=50 && Number.isInteger(cfg2.minRaters))) bad='Team responses needed must be a whole number of at least 3.';
  else if(!(cfg2.timeLimitMin>=10 && cfg2.timeLimitMin<=180)) bad='The time guide must be between 10 and 180 minutes.';
  if(bad){ C.msg=bad; C.msgBad=true; render(); return; }
  C.busy=true; render();
  try{
    await retry(function(){ return st.db.doc('admin/settings').set(Object.assign({uid:'settings', updatedAt:nowISO()}, S2)); });
    await retry(function(){ return st.db.doc('public/config').set(Object.assign({updatedAt:nowISO()}, cfg2)); });
    C.settings=S2; Object.assign(st.cfg, cfg2); C.msg='Settings saved.'; C.msgBad=false;
  }catch(e){ C.msg='Could not save the settings. Try again.'; C.msgBad=true; }
  C.busy=false; computeAll(); render();
}
async function saveKey(){
  const C=st.c; const items={}; let bad='';
  ITEMS.forEach(function(it){ const best=$('#k-'+it.id+'-best').value, worst=$('#k-'+it.id+'-worst').value; if(best===worst) bad='Situation '+it.num+': the best and worst response cannot be the same.'; const tags={}; OPT_IDS.forEach(function(o){ tags[o]=(o===best) ? '' : $('#k-'+it.id+'-tag-'+o).value; }); items[it.id]={best:best, worst:worst, tags:tags, why:(C.key.items[it.id]||{}).why||''}; });
  if(bad){ C.msg=bad; C.msgBad=true; render(); return; }
  C.busy=true; render();
  const doc={uid:'key', version:'A-0.1 edited '+dateShort(nowISO()), note:'Edited in the console.', items:items, updatedAt:nowISO()};
  try{ await retry(function(){ return st.db.doc('admin/key').set(doc); }); C.key=doc; if(C.sampleData) C.sampleData=makeSample(C.key); C.msg='Answer key saved. Scores have been recalculated.'; C.msgBad=false; }
  catch(e){ C.msg='Could not save the key. Try again.'; C.msgBad=true; }
  C.busy=false; computeAll(); render();
}
function exportManagers(){
  const M=st.c.model; const head=['name','status','submitted','minutes','score','margin_of_error','level','level_name','red_flags','missed_best'].concat(DIMS.map(function(d){ return 'dim'+d.n; }), ['avoids','dominates','appeases','bends_rules','partial','team_responses','team_average','knows_and_does'], DIMS.map(function(d){ return 'team_dim'+d.n; }), BG_FIELDS.map(function(f){ return f.id; }));
  const rows=M.rows.map(function(r){ const sub=r.status==='submitted'; return [safeText(nameOf(r.uid,r.label)), r.status, r.submittedAt||'', Math.round(r.activeSec/60), sub?r.total:'', sub?f1(M.std.sem):'', sub?r.level:'', sub?LEVELS[r.level]:'', sub?r.rf:'', sub?r.missBest:''].concat(DIMS.map(function(d,ix){ return sub?r.dim[ix]:''; }), sub?[r.pat.A,r.pat.D,r.pat.P,r.pat.R,r.pat.X]:['','','','',''], [r.sv?r.sv.n:0, r.svOk?f2(r.sv.overall):'', r.quad?QUADS[r.quad]:''], DIMS.map(function(d,ix){ return (r.svOk && r.sv.dim[ix]!==null) ? f2(r.sv.dim[ix]) : ''; }), BG_FIELDS.map(function(f){ return safeText(bgValue(r, f.id)); })); });
  return csv([head].concat(rows));
}
function exportAnswers(){
  const M=st.c.model; const head=['name']; ITEMS.forEach(function(it){ head.push(it.num+'_most', it.num+'_least', it.num+'_points'); });
  return csv([head].concat(M.sub.map(function(r){ const row=[safeText(nameOf(r.uid,r.label))]; ITEMS.forEach(function(it){ const a=r.answers[it.id]||{}; row.push((a.m||'').toUpperCase(), (a.l||'').toUpperCase(), r.items[it.id]); }); return row; })));
}
function exportItems(){
  const M=st.c.model, key=st.c.key; const head=['situation','dimension','managers','best_picked_as_most','worst_picked_as_least','red_flag_rate','average_points','link_to_rest','most_A','most_B','most_C','most_D','least_A','least_B','least_C','least_D','checks'];
  return csv([head].concat(M.items.map(function(it){ return [it.num, DIMS[it.dim-1].name, it.n, f2(it.pBest), f2(it.pWorst), f2(it.pRf), f2(it.mean), isFinite(it.rRest)?f2(it.rRest):'', it.dm.a, it.dm.b, it.dm.c, it.dm.d, it.dl.a, it.dl.b, it.dl.c, it.dl.d, itemFlags(it,key).join('; ')]; })));
}
async function wipeAll(){
  const C=st.c; const w=$('#wipe-word'); if(!w || w.value.trim()!=='DELETE'){ C.error='Type DELETE in capitals to confirm.'; render(); return; }
  if(C.busy) return; C.busy=true; C.error=''; render();
  try{
    const ros=await st.db.collection('roster').limit(1000).get();
    for(const r of C.responses) await st.db.doc('responses/'+r.uid).delete();
    for(const d of ros.docs) await st.db.doc('roster/'+d.id).delete();
    for(const s of C.surveys) await st.db.doc('survey/'+s.uid).delete();
    for(const uid in C.vault) await st.db.doc('admin/vault/r/'+uid).delete();
  }catch(e){ C.error='Could not delete everything. Refresh and try again.'; }
  C.busy=false; C.confirmDelete=null; C.sel=null; C.loaded=false; render();
}

/* ---------- hover and focus notes on chart marks ---------- */
function showTip(text, x, y){ const t=$('#tip'); if(!t) return; t.textContent=text; t.hidden=false; placeTip(x,y); }
function placeTip(x, y){ const t=$('#tip'); if(!t || t.hidden) return; const w=t.offsetWidth, hh=t.offsetHeight; let left=x+14, top=y+14; if(left+w>window.innerWidth-8) left=Math.max(8, x-w-14); if(top+hh>window.innerHeight-8) top=Math.max(8, y-hh-14); t.style.left=left+'px'; t.style.top=top+'px'; }
function hideTip(){ const t=$('#tip'); if(t) t.hidden=true; }
document.addEventListener('mouseover', function(e){ const t=e.target && e.target.closest ? e.target.closest('[data-tip]') : null; if(t) showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); else hideTip(); });
document.addEventListener('mousemove', function(e){ placeTip(e.clientX, e.clientY); });
document.addEventListener('focusin', function(e){ const t=e.target && e.target.closest ? e.target.closest('[data-tip]') : null; if(t){ const r=t.getBoundingClientRect(); showTip(t.getAttribute('data-tip'), r.left+r.width/2, r.bottom); } });
document.addEventListener('focusout', hideTip);

window.__mjaStart = function(){ if(window.__mjaStarted) return; window.__mjaStarted = true; boot(); };
})();
